<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classroom Arena</title><style>body{font:16px system-ui;max-width:720px;margin:40px auto;padding:0 16px;background:#101827;color:#eef}section{background:#1b2940;padding:22px;border-radius:14px;margin:16px 0}input,button{font:inherit;padding:10px;margin:5px;border-radius:8px}button{cursor:pointer}li{margin:6px}</style></head><body><h1>Classroom Arena</h1><section><input id="name" placeholder="Your name"><button id="create">Create room</button><input id="code" placeholder="Room code"><button id="join">Join room</button><p id="msg"></p></section><section id="host" hidden><h2>Referee: add questions</h2><textarea id="qs" rows="8" cols="50" placeholder="One JSON array, e.g. [{&quot;text&quot;:&quot;2+2?&quot;,&quot;choices&quot;:[&quot;3&quot;,&quot;4&quot;],&quot;answer&quot;:1}]"></textarea><br><button id="save">Save questions</button><button id="start">Start</button><button id="next">Next / finish</button></section><section><h2 id="status">Room</h2><div id="play"></div><h3>Players / scores</h3><ol id="players"></ol></section><script src="/socket.io/socket.io.js"></script><script>const s=io(),$=id=>document.getElementById(id);let code='',host=false;function msg(t){$('msg').textContent=t}function render(r){$('status').textContent=r.status==='playing'?`Question ${r.index+1} / ${r.total}`:r.status;$('players').innerHTML='';r.players.sort((a,b)=>b.score-a.score).forEach(p=>{let li=document.createElement('li');li.textContent=p.name+' — '+p.score+(p.answered?' (answered)':'');$('players').append(li)});$('play').innerHTML='';if(r.status==='finished'){$('play').textContent='Game finished';return}if(!r.question)return;let h=document.createElement('h2');h.textContent=r.question.text;$('play').append(h);if(host)return;let me=r.players.find(p=>p.id===s.id);if(me?.answered){$('play').textContent+=' — answer locked';return}r.question.choices.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c;b.onclick=()=>s.emit('answer',{code,choice:i},x=>{if(!x.ok)msg(x.error)});$('play').append(b)})} $('create').onclick=()=>s.emit('create',{name:$('name').value},r=>{code=r.code;host=true;$('host').hidden=false;msg('Room code: '+code)});$('join').onclick=()=>{code=$('code').value.toUpperCase();s.emit('join',{code,name:$('name').value},r=>msg(r.ok?'Joined room '+code:r.error))};$('save').onclick=()=>{try{s.emit('questions',{code,questions:JSON.parse($('qs').value)},r=>msg(r.ok?'Questions saved':r.error))}catch(e){msg('Please enter valid JSON')}};$('start').onclick=()=>s.emit('start',{code},r=>msg(r.ok?'Game started':r.error));$('next').onclick=()=>s.emit('next',{code},r=>msg(r.ok?'Advanced':r.error));s.on('update',render);</script></body></html>
